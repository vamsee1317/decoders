<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia</title>
    <style>
        img{
            width: 400px;
            height: 400px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Images -->

    <img src="https://images.pexels.com/photos/26754253/pexels-photo-26754253.jpeg" alt="palace">

    <img src="/assets/images/pexels-christian-skiada-562258729-26754253.jpg" alt="">


    <img src="../../assets/images/pexels-deeonederer-1454769.jpg" alt="">


    <!-- Audio -->
     

    <audio controls muted autoplay loop>
        <source src="/assets/audio/soft_ringtone.mp3" type="audio/mp3">
        Your browser does not support the audio element.
        <source src="/assets/audio/soft_ringtone.wav" type="audio/wav">
        Your browser does not support the audio element.
        <source src="/assets/audio/soft_ringtone.ogg" type="audio/ogg">
    </audio>


    <!-- Video -->

    <video controls muted height="300px" poster="/assets/images/pexels-deeonederer-1454769.jpg">
        Your browser does not support the video tag.
        <source src="/assets/video/6912189-uhd_2160_3840_24fps.mp4" type="video/mp4">
        Your browser does not support the video tag.
        <source src="/assets/video/6912189-uhd_2160_3840_24fps.ogg" type="video/ogg">

    </video>


    
</body>
</html>
