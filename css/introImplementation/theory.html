<!-- 

    CSS : Cascading Style Sheets

    - CSS is used to control the layout and appearance of web pages written in HTML.
    - CSS is used to style the structure of a web page, including colors, fonts, spacing, and more.


    Implementation : 
    - CSS can be implemented in three ways:

    1. Internal CSS : This is the most basic way of implementing CSS. It is used
    to style a single HTML document. It is written inside the HTML document.

    2. External CSS : This is the most common way of implementing CSS. It is used
    to style multiple HTML documents. It is written in a separate file with a .css
    extension.

    3. Inline CSS : This is the least common way of implementing CSS. It is used
    to style a single HTML element. It is written directly inside the HTML element (inside the opening tag).




-->
